{
"Dhcp4": {
    "interfaces-config": { "interfaces": [ "*" ] },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "/tmp/kea4-ctrl-socket"
    },
    "lease-database": {
        "type": "postgresql",
        "host": "172.28.0.10",
        "name": "kea",
        "user": "kea",
        "password": "kea"
    },
    "hooks-libraries": [
        { "library": "/usr/lib/kea/hooks/libdhcp_lease_cmds.so" },
        {
            "library": "/usr/lib/kea/hooks/libdhcp_ha.so",
            "parameters": {
                "high-availability": [ {
                    "this-server-name": "primary",
                    "mode": "hot-standby",
                    "heartbeat-delay": 10000,
                    "max-response-delay": 60000,
                    "max-ack-delay": 5000,
                    "max-unacked-clients": 5,
                    "peers": [
                        { "name": "primary",
                          "url": "http://172.28.0.2:8000/",
                          "role": "primary",
                          "auto-failover": true },
                        { "name": "secondary",
                          "url": "http://172.28.0.3:8000/",
                          "role": "standby",
                          "auto-failover": true }
                    ]
                } ]
            }
        }
    ],
    "subnet4": [ {
        "id": 1,
        "subnet": "172.28.0.0/24",
        "pools": [ { "pool": "172.28.0.100 - 172.28.0.200" } ],
        "option-data": [
            { "name": "routers", "data": "172.28.0.1" },
            { "name": "domain-name-servers", "data": "1.1.1.1" }
        ]
    } ],
    "loggers": [ {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
    } ]
}
}
